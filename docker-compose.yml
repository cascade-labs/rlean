services:
  rlean:
    build:
      context: .
    environment:
      VERGLAS_ENDPOINT: ${VERGLAS_ENDPOINT:-http://host.docker.internal:8334}
      VERGLAS_CATALOG_URI: ${VERGLAS_CATALOG_URI:-}
      VERGLAS_CATALOG_TOKEN: ${VERGLAS_CATALOG_TOKEN:-}
      VERGLAS_WAREHOUSE: ${VERGLAS_WAREHOUSE:-}
      VERGLAS_S3_ENDPOINT: ${VERGLAS_S3_ENDPOINT:-http://host.docker.internal:8333}
      VERGLAS_S3_REGION: ${VERGLAS_S3_REGION:-us-east-1}
      VERGLAS_S3_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-}
      VERGLAS_S3_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${RLEAN_STRATEGY_DIR:-./examples}:/strategy:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    command: ["backtest", "/strategy/main.py"]
