name: Publish crates

# Publish the workspace crates to crates.io in dependency order when a version tag
# is created.
#
# The tag flow already exists: scripts/bump-version.sh opens a "Release v<version>"
# PR, merging it runs auto-tag.yml which pushes the v<version> tag. This workflow
# hooks the same tag. auto-tag.yml pushes the tag with the default GITHUB_TOKEN,
# which by design does NOT trigger other `on: push: tags` workflows, so auto-tag.yml
# also dispatches this workflow explicitly (see auto-tag.yml). A manual
# workflow_dispatch is available to re-run for an existing tag.
#
# Gating: a real publish only happens when the CARGO_REGISTRY_TOKEN repo secret is
# present. Without it the job runs in dry-run mode, which verifies the two crates
# that have no workspace path dependencies (rlean-core, rlean-plugin). cargo cannot
# dry-run the downstream crates of an as-yet-unpublished workspace, because each
# crate resolves its dependencies from the live registry at publish time.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v0.1.1"
        required: true
        default: "v0.1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Python 3.9 headers (PyO3 link target)
        shell: bash
        run: |
          # rlean-python-runtime and rlean link libpython via PyO3 auto-initialize;
          # the verify step of `cargo publish` compiles them, so an interpreter with
          # dev headers must be present.
          sudo apt-get update
          sudo apt-get install -y python3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Assert tag matches workspace version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          CARGO_VER=$(awk '
            /^\[workspace\.package\]/ {inpkg=1; next}
            /^\[/ {inpkg=0}
            inpkg && /^version[[:space:]]*=/ { gsub(/[",]/, "", $0); print $NF; exit }
          ' Cargo.toml)
          echo "tag=${TAG} base=${BASE} cargo=${CARGO_VER}"
          if [ "$BASE" != "$CARGO_VER" ]; then
            echo "ERROR: tag version '$BASE' != Cargo.toml workspace version '$CARGO_VER'" >&2
            exit 1
          fi

      - name: Publish (or dry-run if no token)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set — running in dry-run mode."
            echo "Add the secret to enable real publishing (see the PR description)."
            scripts/publish-crates.sh --dry-run
          else
            echo "CARGO_REGISTRY_TOKEN present — publishing to crates.io."
            scripts/publish-crates.sh
          fi
