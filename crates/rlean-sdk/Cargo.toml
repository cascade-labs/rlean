[package]
name = "rlean-sdk"
version.workspace = true
edition.workspace = true
description = "Strategy-authoring surface for rlean: the types a Rust or Python algorithm builds against."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
rlean-core = { path = "../rlean-core", version = "0.1.1" }
rlean-data = { path = "../rlean-data", version = "0.1.1" }
rlean-data-tables = { path = "../rlean-data-tables", version = "0.1.1" }
rlean-algorithm = { path = "../rlean-algorithm", version = "0.1.1" }
rlean-orders = { path = "../rlean-orders", version = "0.1.1" }
rlean-options = { path = "../rlean-options", version = "0.1.1" }
rlean-alpha = { path = "../rlean-alpha", version = "0.1.1" }
rlean-execution = { path = "../rlean-execution", version = "0.1.1" }
rlean-portfolio-construction = { path = "../rlean-portfolio-construction", version = "0.1.1" }
rlean-risk = { path = "../rlean-risk", version = "0.1.1" }
rlean-indicators = { path = "../rlean-indicators", version = "0.1.1" }

anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[features]
default = []
python = ["dep:pyo3"]
stubs = ["python", "dep:pyo3-stub-gen"]
