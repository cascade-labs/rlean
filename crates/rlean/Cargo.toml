[package]
name = "rlean"
version.workspace = true
edition.workspace = true
description = "Unified Lean-Rust CLI — backtest and live-trade Python or Rust strategies"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "rlean"
path = "src/main.rs"

[[bin]]
name = "rleand"
path = "src/rleand_main.rs"

[dependencies]
rlean-core           = { path = "../rlean-core", version = "0.1.1" }
rlean-data           = { path = "../rlean-data", version = "0.1.1" }
rlean-data-tables    = { path = "../rlean-data-tables", version = "0.1.1" }
rlean-data-sidecar   = { path = "../rlean-data-sidecar", version = "0.1.1" }
rlean-engine         = { path = "../rlean-engine", version = "0.1.1" }
rlean-sdk            = { path = "../rlean-sdk", version = "0.1.1" }
rlean-algorithm      = { path = "../rlean-algorithm", version = "0.1.1" }
rlean-live           = { path = "../rlean-live", version = "0.1.1" }
rlean-python-runtime = { path = "../rlean-python-runtime", version = "0.1.1" }
verglas-sdk         = { workspace = true }

clap               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
rust_decimal       = { workspace = true }
arrow              = { workspace = true }
arrow-array        = { workspace = true }
arrow-schema       = { workspace = true }
arrow-cast         = { workspace = true }
futures            = { workspace = true }
pyo3               = { workspace = true }
glob               = { workspace = true }
base64             = { workspace = true }
libc               = "0.2"
indicatif = "0.18.5"
ctrlc = "3.5.2"
tempfile           = { workspace = true }
sha2               = { workspace = true }
uuid               = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
