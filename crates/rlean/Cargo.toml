[package]
name = "rlean"
version.workspace = true
edition.workspace = true
description = "Unified Lean-Rust CLI — backtest and live-trade Python or Rust strategies"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "rlean"
path = "src/main.rs"

[dependencies]
lean-core           = { path = "../lean-core", version = "0.1.1" }
lean-plugin         = { path = "../lean-plugin", version = "0.1.1" }
lean-data           = { path = "../lean-data", version = "0.1.1" }
lean-data-providers = { path = "../lean-data-providers", version = "0.1.1" }
lean-engine         = { path = "../lean-engine", version = "0.1.1" }
lean-sdk            = { path = "../lean-sdk", version = "0.1.1" }
lean-algorithm      = { path = "../lean-algorithm", version = "0.1.1" }
lean-brokerages     = { path = "../lean-brokerages", version = "0.1.1" }
lean-live           = { path = "../lean-live", version = "0.1.1" }
lean-python-runtime = { path = "../lean-python-runtime", version = "0.1.1" }
lean-storage        = { path = "../lean-storage", version = "0.1.1" }

clap               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
rust_decimal       = { workspace = true }
parquet            = { workspace = true }
arrow              = { workspace = true }
arrow-array        = { workspace = true }
pyo3               = { workspace = true }
libloading         = { workspace = true }
glob               = { workspace = true }
base64             = { workspace = true }
libc               = "0.2"
indicatif = "0.18.5"
ctrlc = "3.5.2"
tempfile           = { workspace = true }
sha2               = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
