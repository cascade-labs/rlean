[package]
name = "rlean"
version.workspace = true
edition.workspace = true
description = "Unified Lean-Rust CLI — backtest and live-trade Python or Rust strategies"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "rlean"
path = "src/main.rs"

[dependencies]
rlean-core           = { path = "../rlean-core", version = "0.1.1" }
rlean-plugin         = { path = "../rlean-plugin", version = "0.1.1" }
rlean-data           = { path = "../rlean-data", version = "0.1.1" }
rlean-data-providers = { path = "../rlean-data-providers", version = "0.1.1" }
rlean-engine         = { path = "../rlean-engine", version = "0.1.1" }
rlean-sdk            = { path = "../rlean-sdk", version = "0.1.1" }
rlean-algorithm      = { path = "../rlean-algorithm", version = "0.1.1" }
rlean-brokerages     = { path = "../rlean-brokerages", version = "0.1.1" }
rlean-live           = { path = "../rlean-live", version = "0.1.1" }
rlean-python-runtime = { path = "../rlean-python-runtime", version = "0.1.1" }
rlean-storage        = { path = "../rlean-storage", version = "0.1.1" }

clap               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
rust_decimal       = { workspace = true }
parquet            = { workspace = true }
arrow              = { workspace = true }
arrow-array        = { workspace = true }
pyo3               = { workspace = true }
libloading         = { workspace = true }
glob               = { workspace = true }
base64             = { workspace = true }
libc               = "0.2"
indicatif = "0.18.5"
ctrlc = "3.5.2"
tempfile           = { workspace = true }
sha2               = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
